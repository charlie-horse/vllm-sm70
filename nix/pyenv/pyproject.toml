# Python env for UNPATCHED vLLM v0.33.0 built from source for Tesla V100 (sm_70).
# vLLM itself is NOT a dependency: it is built from source and put on PYTHONPATH.
# Runtime deps = requirements/common.txt + requirements/cuda.txt, minus the
# sm80+/cu13-only/optional packages (see "Dropped" below).
[project]
name = "vllm-sm70-env"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  # --- torch stack (cu126 index; torch 2.14 is the last release with sm_70) ---
  "torch==2.14.0",            # pulls cuda-toolkit[...]==12.6.3, cuda-bindings<13, nvidia-*-cu12, triton~=3.8.0
  "torchvision==0.29.0",      # Requires-Dist torch==2.14.0
  "triton==3.8.0",
  # --- requirements/cuda.txt (kept) ---
  "numba==0.65.0",            # n-gram spec decode
  "nvtx==0.2.15",             # lazy, LLM_NVTX_SCOPES_FOR_PROFILING only; pure, harmless
  # --- requirements/common.txt ---
  "regex",
  "cachetools",
  "psutil",
  "sentencepiece",
  "numpy",
  "requests>=2.33.0",
  "certifi>=2026.10.19",
  "tqdm",
  "blake3",
  "py-cpuinfo",
  "transformers>=5.16.1,<5.21.0",
  "huggingface_hub>=1.31.0",
  "tokenizers>=0.23.2",
  "safetensors>=0.6.2",
  "protobuf>=5.29.6,!=6.30.*,!=6.31.*,!=6.32.*,!=6.33.0.*,!=6.33.1.*,!=6.33.2.*,!=6.33.3.*,!=6.33.4.*",
  "fastapi[standard]>=0.133.0,<0.137.0",
  "starlette>=1.0.1",
  "aiohttp>=3.14.4",
  "multidict>=6.9.1",
  "openai>=2.25.0",
  "pydantic>=2.12.0",
  "orjson>=3.11.6",
  "prometheus_client>=0.18.0",
  "pillow>=13.0.0",
  "prometheus-fastapi-instrumentator>=8.0.0",
  "tiktoken>=0.6.0",
  "lm-format-enforcer==0.11.3",
  "llguidance>=1.7.0,<1.8.0",
  "outlines_core==0.2.14",
  "lark==1.2.2",
  "xgrammar==0.2.8",          # eager import (vllm/parser/harmony.py:13)
  "typing_extensions>=4.10",
  "filelock>=3.20.3",
  "partial-json-parser",
  "jsonschema>=4.23.0",
  "pyzmq>=25.0.0",
  "msgspec",
  "mistral_common[image]>=1.11.6",
  "opencv-python-headless>=4.13.0",
  "pyyaml",
  "six>=1.16.0",
  "setuptools>=78.1.1,<81.0.0",  # used by triton at runtime
  "einops",
  "compressed-tensors==0.17.0",  # eager import (quantization/compressed_tensors/utils.py:7)
  "depyf==0.20.0",
  "cloudpickle",
  "watchfiles",
  "python-json-logger",
  "ninja",
  "pybase64",
  "cbor2",
  "ijson",
  "setproctitle",
  "oss-harmony>=0.0.11",      # eager import of openai_harmony (vllm/parser/harmony.py:12)
  "anthropic>=0.71.0",
  "model-hosting-container-standards>=0.1.14,<1.0.0",
  "mcp>=2.2.0,<3.0.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-semantic-conventions-ai>=0.4.1",
]
# Dropped from requirements/cuda.txt (sm80+ / cu13-only / optional, all lazily imported):
#   flashinfer-python, tilelang, nvidia-cudnn-frontend, fastsafetensors,
#   instanttensor, nvidia-cutlass-dsl[cu13], quack-kernels, tokenspeed-mla,
#   humming-kernels[cu13], PyNvVideoCodec, torchcodec, torchaudio (2.11.0 is built
#   against torch 2.11; only audio models import it).
# apache-tvm-ffi is not a direct dependency (cuda.txt pins 0.1.11), but xgrammar
# pulls it in, so uv.lock has 0.1.15.post2.

[dependency-groups]
# setup.py build_ext (pyproject [build-system] + requirements/build/cuda.txt).
# setuptools-rust also needs cargo/rustc from Nix for vLLM's _rust_* frontend.
build = [
  "cmake>=3.26.1",
  "ninja",
  "packaging>=24.2",
  "setuptools>=78.1.1,<81.0.0",
  "setuptools-scm>=8",
  "setuptools-rust>=1.9.0",
  "wheel",
  "jinja2>=3.1.6",
  "regex",
  "build",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Belt and braces: never let anything drag in CUDA 13 runtimes/bindings.
constraint-dependencies = [
  # Match the CUDA 12.6 toolkit torch 2.14.0+cu126 was built with.
  "nvidia-nvjitlink-cu12==12.6.85",
  "cuda-bindings<13",
  "cuda-python<13",
  "cuda-toolkit<13",
]
# Make sure nothing transitively re-adds the dropped sm80+/cu13 stacks.
override-dependencies = [
  "flashinfer-python; sys_platform == 'never'",
  "nvidia-cutlass-dsl; sys_platform == 'never'",
  "nvidia-cutlass-dsl-libs-cu13; sys_platform == 'never'",
  "quack-kernels; sys_platform == 'never'",
  "humming-kernels; sys_platform == 'never'",
  "cupy-cuda13x; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
