# Normalization rules for scripts/verify-port.py.
#
# Each [[rule]] is a regex applied to the FORK source (fork -> port spelling)
# before parsing, unless side = "both" (applied to both trees) or "port".
# lang is "cpp", "py" or "all". Every rename the port is allowed to make must
# be listed here, so the list doubles as the reviewable set of expected
# differences. Rules run in file order. Python `re` syntax; use '''raw''' strings.
#
# A body that only differs by these rules is reported IDENTICAL. Anything else
# is CHANGED and must be judged by a reviewer.

# Fork functions/classes whose absence in the port is expected. Regex on the
# qualified name (after rules). Matches are reported DROPPED(expected).
[expected_dropped]
patterns = [
  '''(?i)with_policy''',          # with_policy wrappers removed
  '''(?i)gguf''',                 # GGUF paths dropped
  '''(?i)(^|[_:.])glm''',         # GLM paths dropped
  '''(?i)mxfp4''',                # MXFP4 paths dropped
  '''(?i)tp4''',                  # TP4 paths dropped
  '''(?i)1cat|onecat''',          # 1Cat env/policy indirection
  '''(?i)native_policy''',
  '''^_SHAPES$''',                # M9a: fork sm70_dflash2_fp8.py TP4 shape->split table, replaced by split_for(k)
]

# Port names that are expected to be new (no fork counterpart).
[expected_new]
patterns = [
  '''(?i)sm70config''',
  '''^register''',                # plugin entry points
]

# --- with_policy wrappers removed (must run before the namespace rules) ---

[[rule]]
name = "policy: with_policy(&fn) -> &fn"
lang = "cpp"
pattern = '''(?:\bvllm::)?(?:sm70::)?with_policy\(\s*(&[\w:]+)\s*\)'''
repl = "\\1"

[[rule]]
name = "policy: call_native(op, native_policy, *args) -> op(*args)"
lang = "py"
pattern = '''\bcall_native\(\s*((?:[^(),]|\([^()]*\))+?)\s*,\s*native_policy\s*,\s*'''
repl = "\\1("

# --- namespace / extension name -------------------------------------------

[[rule]]
name = "ext: register_fake/custom_op '_C::' -> '_sm70_C::'"
lang = "py"
pattern = '''(["'])_C::'''
repl = "\\1_sm70_C::"

[[rule]]
name = "ext: torch.ops._C -> torch.ops._sm70_C"
lang = "py"
pattern = '''torch\.ops\._C\b'''
repl = "torch.ops._sm70_C"

[[rule]]
name = "ext: import vllm._C -> vllm_sm70._sm70_C"
lang = "py"
pattern = '''\bvllm\._C\b'''
repl = "vllm_sm70._sm70_C"

[[rule]]
name = "ext: TORCH_LIBRARY*(_C) -> _sm70_C (incl. _FRAGMENT/_IMPL)"
lang = "cpp"
pattern = '''\bTORCH_LIBRARY(\w*)\(\s*(TORCH_EXTENSION_NAME|_C)\b'''
repl = "TORCH_LIBRARY\\1(_sm70_C"

[[rule]]
name = "ns: namespace vllm -> namespace vllm_sm70"
lang = "cpp"
pattern = '''\bnamespace\s+vllm\b'''
repl = "namespace vllm_sm70"
# Exemption (PR #12, K02): the vendored TurboMind tree keeps the fork's C++
# namespaces (vllm::sm70, vllm::awq_sm70) verbatim so 106 files stay
# byte-identical to cf9492a. Safe: upstream v0.33.0 csrc/ defines no
# vllm::sm70 / vllm::awq_sm70 / turbomind namespace, so no symbol in
# _sm70_C can collide with upstream _C. Covers the whole tree (ops/ keeps
# the namespaces too), not only lmdeploy/**.
exclude_paths = ["*/sm70/csrc/turbomind/*", "*/csrc/sm70_turbomind/*", "*/csrc/sm70_policy.h"]  # fork sm70_policy.h -> turbomind/ops/tm_config.h

[[rule]]
name = "ns: vllm:: -> vllm_sm70::"
lang = "cpp"
pattern = '''(?<![\w:])vllm::'''
repl = "vllm_sm70::"
# Exemption (PR #12, K02): the vendored TurboMind tree keeps the fork's C++
# namespaces (vllm::sm70, vllm::awq_sm70) verbatim so 106 files stay
# byte-identical to cf9492a. Safe: upstream v0.33.0 csrc/ defines no
# vllm::sm70 / vllm::awq_sm70 / turbomind namespace, so no symbol in
# _sm70_C can collide with upstream _C. Covers the whole tree (ops/ keeps
# the namespaces too), not only lmdeploy/**.
exclude_paths = ["*/sm70/csrc/turbomind/*", "*/csrc/sm70_turbomind/*", "*/csrc/sm70_policy.h"]  # fork sm70_policy.h -> turbomind/ops/tm_config.h

# --- native_policy argument removed ----------------------------------------

[[rule]]
name = "policy: drop C++ param std::optional<std::string> native_policy"
lang = "cpp"
pattern = ''',\s*(const\s+)?(std::)?optional<\s*(std::)?string\s*>\s*(const\s*)?&?\s*native_policy(\s*=\s*[^,)]*)?'''
repl = ""

[[rule]]
name = "policy: drop schema arg 'str? native_policy'"
lang = "all"
pattern = ''',\s*str\?\s*native_policy(\s*=\s*None)?'''
repl = ""

[[rule]]
name = "policy: drop Python param native_policy"
lang = "py"
pattern = ''',\s*native_policy\s*(:\s*(?:\w+\[[^\]]*\]|[^,)=\[]+))?(\s*=\s*(?:\(\)|None|[^,()]+))?(?=\s*[,)])'''
repl = ""

[[rule]]
name = "policy: drop call-site native_policy argument"
lang = "all"
pattern = ''',\s*(native_policy\s*=\s*)?native_policy\b'''
repl = ""

# --- M9a (PR #92): fork quantization/sm70_dflash2_fp8.py -> vllm_sm70/ops/dflash2_fp8.py ---

[[rule]]
name = "M9a: _fp8_rows -> fp8_rows (public: the U1 dispatcher and tests use it)"
lang = "py"
pattern = '''\b_fp8_rows\b'''
repl = "fp8_rows"

[[rule]]
name = "M9a: def _dispatch(x, weight, codes, ...) -> def _dispatch_impl (custom-op impl)"
lang = "py"
# Anchored on the signature: other fork files also define _dispatch.
pattern = '''\bdef _dispatch(\(\s*x: torch\.Tensor,\s*weight: torch\.Tensor,\s*codes: torch\.Tensor)'''
repl = "def _dispatch_impl\\1"
