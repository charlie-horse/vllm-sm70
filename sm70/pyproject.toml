[build-system]
# torch is deliberately not listed: an isolated build would download it.
# The extension build imports the installed torch 2.14.0, so build it with
# `pip install --no-build-isolation` (Nix does). VLLM_SM70_SKIP_EXT=1
# builds the pure-Python package, which needs only setuptools.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-sm70"
version = "0.1.0"
description = "Volta (SM70) kernels and plugins for vLLM v0.33.0"
license = "Apache-2.0"
requires-python = ">=3.10"
# Entry points come from nix-entry_points.txt (single source of truth),
# read by setup.py.
dynamic = ["entry-points"]

[tool.setuptools.packages.find]
include = ["vllm_sm70*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an SM70 GPU (deselect with -m 'not gpu')"]
